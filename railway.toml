[build]
builder = "NIXPACKS"

[build.env]
NPM_CONFIG_PRODUCTION = "false"
NODE_VERSION = "22"
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "${RAILWAY_PUBLIC_DOMAIN}"

[build.phases]
build = "npm run build"

[build.nixpacks]
phases = {
  build = {
    cmds = [
      "npm install",
      "npm run build",
      "php artisan key:generate --force",
      "php artisan migrate --force",
      "php artisan config:cache",
      "php artisan route:cache",
      "php artisan storage:link"
    ]
  }
}
providers = ["node@22"]

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=${PORT}"
healthcheckPath = "/"

[deploy.healthcheck]
path = "/"
initialDelaySeconds = 30
periodSeconds = 10
timeoutSeconds = 10
failureThreshold = 3
